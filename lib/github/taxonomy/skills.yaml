    name: Bootstrap
    category: framework
    parent: css
    npm: [bootstrap, react-bootstrap]
    imports:
      - { ext: [html, php, jsx, tsx, vue], match: 'class(?:Name)?="[^"]*\b(?:container-fluid|col-(?:sm|md|lg|xl)-\d+|btn-primary|navbar-expand)' }
    examples:
      - { path: index.html, added: ['<div class="container-fluid"><button class="btn btn-primary">Go</button></div>'] }
