# Skilient skill taxonomy (PRD 5.5 "Skill taxonomy and detectors").
#
# Owned by Skilient Trust staff; reviewed quarterly. Edit here, bump `version`, then run
# `pnpm skills:sync` to write a migration that loads it into `skills` (ids never change;
# a removed skill is retired, never deleted, so evidence keeps its reference).
#
# Each skill: id (stable slug), name, category (language | framework | library | tool |
# platform | practice), optional parent, and detectors. Detectors only ever look at lines
# the student's own commits ADD, and at files those commits add or change:
#
#   files:      file-name globs. For languages, lines in these files are the evidence;
#               for everything else, touching such a file is one hit.
#   paths:      path globs touched (config paths: workflows, migrations, ...).
#   linguist:   GitHub language names, for "found in your repos" (L1) from repo stats.
#   npm, pypi, maven + jvm, nuget, composer + php_ns, go, cargo, gem, pub:
#               ecosystem shorthands, expanded by scripts/skills.mjs into a manifest
#               detector (the package added to package.json, requirements.txt, pom.xml,
#               ...) plus an import detector (the package imported in added code).
#               An npm name ending in "/" is a scope prefix; a pypi package ending in
#               "*" is a name prefix.
#   imports / manifests: custom regexes ({ ext | file, match, flags? }) when a shorthand
#               doesn't fit.
#   examples:   fixtures (one changed file each) that must detect this skill. The unit
#               tests run every one; they're never loaded into the database.
#
# Globs: `*` stays inside one path segment, `**` crosses segments, and a glob without a
# slash matches the file name in any folder.

version: 1

skills:
  # ------------------------------------------------------------------ languages
  - id: python
    name: Python
    category: language
    linguist: [Python]
    files: ['*.py', '*.pyw', '*.pyi']
    examples:
      - { path: app/main.py, added: ['def main():', '    return 1'] }
  - id: java
    name: Java
    category: language
    linguist: [Java]
    files: ['*.java']
    examples:
      - { path: src/main/java/App.java, added: ['public class App {}'] }
  - id: c
    name: C
    category: language
    linguist: [C]
    files: ['*.c', '*.h']
