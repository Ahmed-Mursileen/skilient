      - { path: src/graph.cpp, added: ['#include <vector>', 'int main() { std::vector<int> v; }'] }
  - id: csharp
    name: C#
    category: language
    linguist: [C#]
    files: ['*.cs', '*.csx']
    examples:
      - { path: Program.cs, added: ['Console.WriteLine("hi");'] }
  - id: javascript
    name: JavaScript
    category: language
    linguist: [JavaScript]
    files: ['*.js', '*.jsx', '*.mjs', '*.cjs']
    examples:
      - { path: src/index.js, added: ['const x = 1;'] }
  - id: typescript
