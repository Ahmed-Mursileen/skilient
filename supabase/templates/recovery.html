<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Reset your password</title>
</head>
<body style="margin:0;padding:0;background:#F0EFED;color:#0E0D0B;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F0EFED;padding:32px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border:1px solid #DAD8D3;border-radius:12px;">
<tr><td style="padding:32px 32px 8px 32px;">
<p style="margin:0 0 24px 0;font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;letter-spacing:-0.01em;">Skilient<span style="color:#C03910;">.</span></p>
<h1 style="margin:0 0 16px 0;font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:32px;font-weight:700;">Reset your password</h1>
<p style="margin:0 0 16px 0;font-size:15px;line-height:24px;">Open this link to choose a new password. It works for 15 minutes and only once.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px 0;"><tr><td style="border-radius:8px;background:#0E0D0B;">
<a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:12px 20px;font-size:15px;font-weight:700;color:#FFFFFF;text-decoration:none;border-radius:8px;">Choose a new password</a>
</td></tr></table>
<p style="margin:0 0 16px 0;font-size:15px;line-height:24px;">Changing your password signs you out on every other device.</p>
</td></tr>
<tr><td style="padding:16px 32px 32px 32px;border-top:1px solid #ECEAE6;">
<p style="margin:0;font-size:13px;line-height:20px;color:#5C5A55;">If you didn't ask to reset your password, you can ignore this email. Your password stays the same.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
